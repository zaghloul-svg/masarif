name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run engine unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (debug-signed, installable)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Masarif-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Masarif-release.apk || true
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masarif-APK
          path: out/*.apk
          retention-days: 90

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Masarif latest build
          body: |
            Latest Masarif build. Download **Masarif-release.apk** on your phone and open it to install.
            You will need to allow "Install unknown apps" for your browser the first time.
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
