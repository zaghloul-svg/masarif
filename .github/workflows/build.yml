name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # New repositories hand Actions a read-only token by default, which makes
    # the release step fail with a 403. Ask for write access explicitly.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Written from a repository secret, never committed. Without the secret the
      # build still works and falls back to the debug key.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MASARIF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > masarif-release.jks
            echo "Release keystore restored ($(wc -c < masarif-release.jks) bytes)"
          else
            echo "::warning::No MASARIF_KEYSTORE_BASE64 secret set - release will be signed with the debug key and Play Protect may block it."
          fi

      - name: Run engine unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        env:
          MASARIF_KEYSTORE_PASSWORD: ${{ secrets.MASARIF_KEYSTORE_PASSWORD }}
          MASARIF_KEY_ALIAS: masarif
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Report which certificate signed the release
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if grep -qa "Android Debug" "$APK"; then
            echo "::warning::Release APK is DEBUG-SIGNED. Play Protect is likely to block it."
          else
            echo "Release APK is signed with the release key (no debug certificate present)."
          fi

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Masarif-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Masarif-release.apk || true
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masarif-APK
          path: out/*.apk
          retention-days: 90

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Masarif latest build
          body: |
            Latest Masarif build. Download **Masarif-release.apk** on your phone and open it to install.
            You will need to allow "Install unknown apps" for your browser the first time.
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
